<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d1838" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221c44" media="(prefers-color-scheme: dark)" />
    <!-- Een polsbandjeslink bevat een token: nooit als referrer doorgeven. -->
    <meta name="referrer" content="no-referrer" />
    <title>Linked | Ask for help</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="request-store.js" defer></script>
    <script src="wristband-api.js" defer></script>
    <script src="wristband-tap.js" defer></script>
    <script src="confetti.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <span class="brand" aria-label="Linked">
        <b aria-hidden="true">↗</b>
        linked<span>.</span>
      </span>
      <div class="header-actions">
        <button
          id="sound-toggle"
          class="header-button sound-toggle"
          type="button"
          aria-pressed="true"
        >
          <svg class="sound-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
            <path class="sound-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path class="sound-off" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span id="sound-toggle-label" class="visually-hidden">Sound on</span>
        </button>
        <span class="pill">Demo</span>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">A little closer to <em>help.</em></h1>
      </section>

      <section class="help-card" aria-labelledby="request-title">
        <h2 id="request-title" class="visually-hidden">Your help request</h2>

        <div
          id="wristband-notice"
          class="status-banner wristband-notice"
          role="status"
          aria-live="polite"
          hidden
        >
          <strong id="wristband-notice-title"></strong>
          <p id="wristband-notice-text"></p>
        </div>

        <button id="request-button" class="btn btn-help" type="button">
          <span class="help-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="30" height="30">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4" />
              <circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="2.4" />
              <path d="M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9" stroke="currentColor" stroke-width="2.4" />
            </svg>
          </span>
          <span id="request-button-label" class="help-label">Ask for help</span>
        </button>
        <button
          id="cancel-button"
          class="btn btn-outline btn-block cancel-button"
          type="button"
          hidden
        >
          Cancel request
        </button>

        <div
          id="request-status"
          class="status-banner request-status"
          data-status="idle"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <strong id="status-title">No active request</strong>
            <p id="status-description">Tap the button when you need someone.</p>
          </div>
        </div>

        <figure
          id="request-map"
          class="request-map"
          data-status="idle"
        >
          <svg
            viewBox="0 0 320 180"
            role="img"
            aria-labelledby="map-caption"
          >
            <g class="map-blocks">
              <rect x="12" y="12" width="70" height="48" rx="6" />
              <rect x="96" y="12" width="88" height="48" rx="6" />
              <rect x="198" y="12" width="110" height="30" rx="6" />
              <rect x="12" y="74" width="70" height="94" rx="6" />
              <rect x="198" y="56" width="50" height="56" rx="6" />
              <rect x="262" y="56" width="46" height="112" rx="6" />
              <rect x="96" y="120" width="152" height="48" rx="6" />
            </g>
            <path
              class="map-park"
              d="M100 74 h40 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-40
                 a4 4 0 0 1 -4 -4 v-32 a4 4 0 0 1 4 -4 z"
            />
            <g class="map-links">
              <line x1="172" y1="90" x2="47" y2="36" />
              <line x1="172" y1="90" x2="285" y2="28" />
              <line x1="172" y1="90" x2="223" y2="145" />
            </g>
            <g class="map-helpers">
              <circle cx="47" cy="36" r="7" />
              <circle cx="285" cy="28" r="7" />
              <circle cx="223" cy="145" r="7" />
            </g>
            <g class="map-pulses">
              <circle cx="172" cy="90" r="10" />
              <circle cx="172" cy="90" r="10" />
            </g>
            <circle class="map-you" cx="172" cy="90" r="9" />
          </svg>
          <figcaption id="map-caption">
            Illustration, not your real location.
          </figcaption>
        </figure>

        <p class="demo-note">
          <span>Demo · Emergency?</span>
          <a class="call-chip" href="tel:112">Call 112</a>
        </p>
        <noscript>
          <p class="script-warning">
            Turn on JavaScript to use the help button.
          </p>
        </noscript>
      </section>

      <nav class="page-nav" aria-label="Other views">
        <a class="btn btn-ghost btn-sm" href="volunteer.html">Volunteer inbox →</a>
      </nav>
    </main>

  </body>
</html>
