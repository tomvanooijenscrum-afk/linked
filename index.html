<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="theme-color" content="#183e37" />
    <title>Linked | Ask for help</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="request-store.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <span class="brand" aria-label="Linked">
        <b aria-hidden="true">↗</b>
        linked<span>.</span>
      </span>
      <span class="demo-label">Demo</span>
    </header>

    <main>
      <section class="help-card" aria-labelledby="page-title">
        <h1 id="page-title">Need help?</h1>
        <p class="help-instruction">Tap once to ask for help.</p>

        <button
          id="request-button"
          class="primary"
          type="button"
          aria-describedby="demo-notice"
        >
          <span id="request-button-label">Ask for help</span>
          <span aria-hidden="true">↗</span>
        </button>
        <button
          id="cancel-button"
          class="secondary"
          type="button"
          hidden
        >
          Cancel request
        </button>

        <div
          id="request-status"
          class="status-banner"
          hidden
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          <strong id="status-title">No active request</strong>
          <p id="status-description">
            You haven’t asked for help yet.
          </p>
        </div>

        <figure
          id="request-map"
          class="request-map"
          hidden
          data-status="idle"
        >
          <svg
            viewBox="0 0 320 180"
            role="img"
            aria-labelledby="map-caption"
          >
            <g class="map-blocks">
              <rect x="12" y="12" width="70" height="48" rx="6" />
              <rect x="96" y="12" width="88" height="48" rx="6" />
              <rect x="198" y="12" width="110" height="30" rx="6" />
              <rect x="12" y="74" width="70" height="94" rx="6" />
              <rect x="198" y="56" width="50" height="56" rx="6" />
              <rect x="262" y="56" width="46" height="112" rx="6" />
              <rect x="96" y="120" width="152" height="48" rx="6" />
            </g>
            <path
              class="map-park"
              d="M100 74 h40 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-40
                 a4 4 0 0 1 -4 -4 v-32 a4 4 0 0 1 4 -4 z"
            />
            <g class="map-links">
              <line x1="172" y1="90" x2="47" y2="36" />
              <line x1="172" y1="90" x2="285" y2="28" />
              <line x1="172" y1="90" x2="223" y2="145" />
            </g>
            <g class="map-helpers">
              <circle cx="47" cy="36" r="7" />
              <circle cx="285" cy="28" r="7" />
              <circle cx="223" cy="145" r="7" />
            </g>
            <g class="map-pulses">
              <circle cx="172" cy="90" r="10" />
              <circle cx="172" cy="90" r="10" />
            </g>
            <circle class="map-you" cx="172" cy="90" r="9" />
          </svg>
          <figcaption id="map-caption">
            Illustration only. Not your real location.
          </figcaption>
        </figure>

        <p id="demo-notice" class="demo-note">
          Demo only. No real request is sent. In an emergency, call
          <a href="tel:112">112</a>.
        </p>
        <noscript>
          <p class="script-warning">
            Enable JavaScript to use the help button.
            Without JavaScript, no request will be started.
          </p>
        </noscript>
      </section>

      <details class="settings">
        <summary>Demo options</summary>
        <div class="settings-content">
          <button
            id="sound-toggle"
            class="sound-toggle"
            type="button"
            aria-pressed="true"
          >
            <span aria-hidden="true">♪</span>
            <span id="sound-toggle-label">Sound on</span>
          </button>
          <a class="sound-toggle" href="volunteer.html">Open volunteer inbox</a>
        </div>
      </details>
    </main>

  </body>
</html>
